name: Main

on:
  push:

env:
  KOSLI_API_TOKEN: ${{ secrets.KOSLI_API_TOKEN }}
  KOSLI_AWS_BETA:  ${{ vars.KOSLI_AWS_BETA }}          # aws-beta
  KOSLI_DEBUG:     ${{ vars.KOSLI_DEBUG }}             # true/false
  KOSLI_DRY_RUN:   ${{ vars.KOSLI_DRY_RUN }}           # true/false
  KOSLI_HOST:      ${{ vars.KOSLI_HOST }}              # https://app.kosli.com
  KOSLI_ORG:       ${{ vars.KOSLI_ORG }}               # cyber-dojo
  KOSLI_FLOW:      ${{ vars.KOSLI_FLOW }}              # differ-ci
  KOSLI_TRAIL:     ${{ github.sha }}

  AWS_ECR_ID:             ${{ vars.AWS_ECR_ID }}
  AWS_REGION:             ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID_BETA:    ${{ vars.AWS_ACCOUNT_ID_BETA }}
  SERVICE_NAME:           ${{ github.event.repository.name }}  # differ
  SONARCLOUD_PROJECT_KEY: ${{ github.repository_owner }}_${{ github.event.repository.name }}  # cyber-dojo_differ

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      aws_account_id_beta:      ${{ steps.vars.outputs.aws_account_id_beta }}
      ecr_registry:             ${{ steps.vars.outputs.ecr_registry }}
      aws_region:               ${{ steps.vars.outputs.aws_region }}
      gh_actions_iam_role_name: ${{ steps.vars.outputs.gh_actions_iam_role_name }}
      service_name:             ${{ steps.vars.outputs.service_name }}
      image_tag:                ${{ steps.vars.outputs.image_tag }}
      image_name:               ${{ steps.vars.outputs.image_name }}
      kosli_flow:               ${{ steps.vars.outputs.kosli_flow }}
      kosli_trail:              ${{ steps.vars.outputs.kosli_trail }}
    steps:
      - uses: cyber-dojo/harden-runner@main
      - uses: cyber-dojo/pinned-checkout@main

      - name: Prepare outputs for workflow jobs
        id: vars
        run: |
          ECR_REGISTRY="${AWS_ECR_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_TAG=${GITHUB_SHA:0:7}
          IMAGE_NAME="${ECR_REGISTRY}/${{ env.SERVICE_NAME }}:${IMAGE_TAG}"
          {
            echo "aws_account_id_beta=${AWS_ACCOUNT_ID_BETA}"
            echo "ecr_registry=${ECR_REGISTRY}"
            echo "aws_region=${AWS_REGION}"
            echo "gh_actions_iam_role_name=gh_actions_services"
            echo "service_name=${{ env.SERVICE_NAME }}"
            echo "image_tag=${IMAGE_TAG}"
            echo "image_name=${IMAGE_NAME}"
            echo "kosli_flow=${KOSLI_FLOW}"
            echo "kosli_trail=${KOSLI_TRAIL}"
          } > ${GITHUB_OUTPUT}

      - name: Begin Kosli Trail
        uses: cyber-dojo/kosli-begin-trail@main
        with:
          flow_description: "Diff files from two traffic-lights"
          flow_tags: |
            env=${{ env.KOSLI_AWS_BETA }}
            kind=build
            ci=github
            repo_url=${{ github.server_url }}/${{ github.repository }}


  pull-request:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [setup]
    permissions:
      id-token:      write
      contents:      read
      pull-requests: read
    steps:
      - uses: cyber-dojo/harden-runner@main
      - uses: cyber-dojo/pinned-checkout@main
      - uses: cyber-dojo/setup-kosli-cli@main

      - name: Attest pull-request evidence to Kosli
        run:
          kosli attest pullrequest github
            --github-token=${{ secrets.GITHUB_TOKEN }}
            --name=pull-request


  rubocop-lint:
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: cyber-dojo/harden-runner@main
      - uses: cyber-dojo/pinned-checkout@main
      - uses: cyber-dojo/setup-kosli-cli@main

      - name: Run Rubocop linter on source
        run:
          make rubocop_lint

      - name: Attest evidence to Kosli
        if: ${{ github.ref == 'refs/heads/main' && (success() || failure()) }}
        run:
          kosli attest junit
            --name=differ.rubocop-lint
            --results-dir=./reports/rubocop


  # The bare image: the Dockerfile's base stage (Ruby, its gems, the OS
  # packages and the nobody user, with no source code), one per platform, as
  # the artifacts differ-bare-image-amd64 and -arm64, with their digests. The
  # unit tests run in the linux/amd64 one, and build-image builds the deployed
  # image FROM each, both checking the digests. The Dockerfile's APK_REFRESH
  # explains how its unpinned packages are refreshed. It needs nothing from
  # setup, so it runs alongside it.
  bare-image:
    uses: cyber-dojo/reusable-actions-workflows/.github/workflows/build-bare-image.yml@main
    with:
      checkout_repository: cyber-dojo/differ
      checkout_ref: ${{ github.sha }}
      artifact_prefix: differ-bare-image


  build-image:
    needs: [setup, bare-image]
    uses: cyber-dojo/reusable-actions-workflows/.github/workflows/secure-docker-build-from-bare-image.yml@main
    with:
      checkout_repository: cyber-dojo/differ
      checkout_ref: ${{ github.sha }}
      checkout_fetch_depth: 1
      image_name: ${{ needs.setup.outputs.ecr_registry }}/${{ needs.setup.outputs.service_name }}
      image_tag: ${{ needs.setup.outputs.image_tag }}
      image_build_args: |
        COMMIT_SHA=${{ github.sha }}
      bare_image_artifact_prefix: differ-bare-image
      bare_image_digest_amd64: ${{ needs.bare-image.outputs.digest_amd64 }}
      bare_image_digest_arm64: ${{ needs.bare-image.outputs.digest_arm64 }}
      kosli_flow: ${{ needs.setup.outputs.kosli_flow }}
      kosli_trail: ${{ needs.setup.outputs.kosli_trail }}
      kosli_reference_name: ${{ needs.setup.outputs.service_name }}
      attest_to_kosli: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      kosli_api_token: ${{ secrets.KOSLI_API_TOKEN }}
      docker_user: ${{ secrets.DOCKER_USER }}
      docker_pass: ${{ secrets.DOCKER_PASS }}


  snyk-container-scan:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [setup, build-image]
    uses: cyber-dojo/snyk-scanning/.github/workflows/artifact_snyk_test.yml@main
    with:
      artifact_name: ${{ needs.build-image.outputs.tagged_image_name }}
      kosli_flow: ${{ needs.setup.outputs.kosli_flow }}
      kosli_trail: ${{ needs.setup.outputs.kosli_trail }}
      kosli_attestation_name: differ.snyk-container-scan
    secrets:
      snyk_token: ${{ secrets.SNYK_TOKEN }}
      kosli_api_token: ${{ secrets.KOSLI_API_TOKEN }}


  # The server tests run in the bare image, so they start without waiting for
  # the deployed image. With no fingerprint, Kosli binds their attestations to
  # the differ artifact by the commit. They need setup, which begins the Kosli
  # trail they attest to.
  unit-tests:
    runs-on: ubuntu-latest
    needs: [setup, bare-image]
    steps:
      - uses: cyber-dojo/harden-runner@main
      - uses: cyber-dojo/pinned-checkout@main
      - uses: cyber-dojo/setup-kosli-cli@main

      - name: Download the bare image
        uses: actions/download-artifact@v8
        with:
          name: differ-bare-image-amd64
          path: ${{ runner.temp }}

      - name: Load the bare image, checking its digest
        env:
          EXPECTED: ${{ needs.bare-image.outputs.digest_amd64 }}
        run: |
          ACTUAL="$(tar --extract --to-stdout --file="${{ runner.temp }}/bare-image.tar" index.json \
                    | jq --raw-output '.manifests[0].digest')"
          if [ -z "${EXPECTED}" ] || [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "linux/amd64 bare image digest is '${ACTUAL}', expected '${EXPECTED}'"
            exit 1
          fi
          docker load --input "${{ runner.temp }}/bare-image.tar"

      - name: Run unit tests with metrics checks, in the bare image
        env:
          CYBER_DOJO_DIFFER_BARE_IMAGE: differ-bare-image:local
        run:
          make test_server_bare

      - name: Upload the bare image's packages, for bare-image-match
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: bare-image-packages
          path: reports/server/bare_image_packages.txt
          if-no-files-found: error
          retention-days: 1

      - name: Attest junit test evidence to Kosli
        if: ${{ github.ref == 'refs/heads/main' && (success() || failure()) }}
        run:
          kosli attest junit
            --name=differ.unit-test 
            --results-dir=./reports/server/junit

      - name: Attest test metrics to Kosli
        if: ${{ github.ref == 'refs/heads/main' && (success() || failure()) }}
        run:
          kosli attest custom
            --attestation-data=./reports/server/test_metrics.json 
            --name=differ.unit-test-metrics
            --type=test-metrics

      - name: Attest coverage metrics to Kosli
        if: ${{ github.ref == 'refs/heads/main' && (success() || failure()) }}
        run:
          kosli attest custom
            --attestation-data=./reports/server/coverage_metrics.json 
            --name=differ.unit-test-coverage-metrics
            --type=coverage-metrics


  # build-image builds the deployed image FROM the bare image the unit tests
  # ran in, so their packages (Ruby, every gem, every OS package) should be
  # identical; a Dockerfile edit adding to its last stage would make them
  # differ. The result is attested as differ.bare-image-match, which the
  # Kosli flow template requires, so a difference, or no attestation at all,
  # leaves the deployed image non-compliant.
  bare-image-match:
    if: ${{ !cancelled() && needs.build-image.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [build-image, unit-tests]
    env:
      KOSLI_FINGERPRINT: ${{ needs.build-image.outputs.digest }}
    steps:
      - uses: cyber-dojo/harden-runner@main
      - uses: cyber-dojo/pinned-checkout@main
      - uses: cyber-dojo/setup-kosli-cli@main

      - name: Download docker image
        uses: cyber-dojo/download-artifact@main
        with:
          image_digest: ${{ needs.build-image.outputs.digest }}

      - name: Download the packages of the bare image the unit tests ran in
        id: bare-packages
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: bare-image-packages
          path: packages

      - name: Compare them with the deployed image's packages
        id: match
        run: |
          mkdir -p packages
          bin/image_packages.sh image "${{ needs.build-image.outputs.tagged_image_name }}" \
            > packages/deployed_image_packages.txt
          COMPLIANT=false
          if [ "${{ steps.bare-packages.outcome }}" == success ] \
             && diff --unified packages/bare_image_packages.txt packages/deployed_image_packages.txt; then
            COMPLIANT=true
          fi
          echo "compliant=${COMPLIANT}" >> "${GITHUB_OUTPUT}"

      - name: Attest the comparison to Kosli
        if: ${{ github.ref == 'refs/heads/main' }}
        run:
          kosli attest generic
            --name=differ.bare-image-match
            --compliant=${{ steps.match.outputs.compliant }}
            --attachments=packages

      - name: Fail unless the deployed image's packages are the bare image's
        run:
          test "${{ steps.match.outputs.compliant }}" == true


  integration-tests:
    runs-on: ubuntu-latest
    needs: [build-image]
    env:
      KOSLI_FINGERPRINT: ${{ needs.build-image.outputs.digest }}
    steps:
      - uses: cyber-dojo/harden-runner@main
      - uses: cyber-dojo/pinned-checkout@main
      - uses: cyber-dojo/setup-kosli-cli@main

      - name: Download docker image
        uses: cyber-dojo/download-artifact@main
        with:
          image_digest: ${{ needs.build-image.outputs.digest }}

      - name: Run integration tests with metrics checks
        run:
          make image_client test_client metrics_test_client metrics_coverage_client

      - name: Attest junit test evidence to Kosli
        if: ${{ github.ref == 'refs/heads/main' && (success() || failure()) }}
        run:
          kosli attest junit
            --name=differ.integration-test 
            --results-dir=./reports/client/junit

      - name: Attest test metrics to Kosli
        if: ${{ github.ref == 'refs/heads/main' && (success() || failure()) }}
        run:
          kosli attest custom 
            --attestation-data=./reports/client/test_metrics.json 
            --name=differ.integration-test-metrics
            --type=test-metrics

      - name: Attest coverage metrics to Kosli
        if: ${{ github.ref == 'refs/heads/main' && (success() || failure()) }}
        run:
          kosli attest custom 
            --attestation-data=./reports/client/coverage_metrics.json 
            --name=differ.integration-test-coverage-metrics
            --type=coverage-metrics


  sonarcloud-scan:
    runs-on: ubuntu-latest
    needs: [build-image]
    env:
      KOSLI_FINGERPRINT: ${{ needs.build-image.outputs.digest }}
    steps:
      - uses: cyber-dojo/harden-runner@main
      - uses: cyber-dojo/pinned-checkout@main

      - name: Run SonarCloud scan - report results to Kosli (in Kosli webhook)
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        with:
          args: >
            -Dsonar.analysis.kosli_flow=${{ env.KOSLI_FLOW }}
            -Dsonar.analysis.kosli_trail=${{ env.KOSLI_TRAIL }}
            -Dsonar.analysis.kosli_artifact_fingerprint=${{ env.KOSLI_FINGERPRINT }}
            -Dsonar.analysis.kosli_attestation=differ.sonarcloud-scan



  sdlc-control-gate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs:
      - pull-request
      - rubocop-lint
      - build-image
      - unit-tests
      - bare-image-match
      - integration-tests
      - sonarcloud-scan
      - snyk-container-scan
    steps:
      - uses: cyber-dojo/harden-runner@main
      - uses: cyber-dojo/setup-kosli-cli@main

      - name: Display current compliance
        run:
          kosli get trail "${KOSLI_TRAIL}"
            --output markdown >> "${GITHUB_STEP_SUMMARY}"

      - name: Kosli SDLC gate to short-circuit the workflow
        env:
          KOSLI_FINGERPRINT: ${{ needs.build-image.outputs.digest }}
        run:
          kosli assert artifact
            --environment=${KOSLI_AWS_BETA}


  deploy-to-beta:
    needs: [setup, build-image, sdlc-control-gate]
    permissions:
      id-token: write
      contents: write
      pull-requests: read
    uses: kosli-dev/tf/.github/workflows/apply.yml@main
    with:
      aws_region: eu-central-1
      aws_role_arn: arn:aws:iam::${{ needs.setup.outputs.aws_account_id_beta }}:role/${{ needs.setup.outputs.gh_actions_iam_role_name }}
      environment: beta
      working_directory: deployment/terraform-differ/
      tf_version: v1.14.9
      tf_vars: |
        TF_VAR_TAGGED_IMAGE=${{ needs.build-image.outputs.tagged_image_name }}@sha256:${{ needs.build-image.outputs.digest }}
      kosli_host: ${{ vars.KOSLI_HOST }}
      kosli_org: cyber-dojo
      kosli_template_file: flow-templates/kosli-apply.yml
    secrets:
      kosli_api_token: ${{ secrets.KOSLI_API_TOKEN }}
      kosli_github_token: ${{ secrets.GITHUB_TOKEN }}

# Deployment to aws-prod Environment is done with a Release/Promotion workflow.
# See https://github.com/cyber-dojo/aws-prod-co-promotion
